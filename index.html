<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13151b"><title>陪一根</title><link rel="stylesheet" href="style.css?v=smoke1">
<main><header><h1>陪<span>一根</span></h1></header>
<section id="shop"><h2 id="shopTitle">选一盒烟</h2><div class="shelf" role="group" aria-label="选择品牌">
<button class="choice" data-brand="red" aria-pressed="true"><span class="pack-photo zhonghua"><img src="assets/zhonghua.jpg" alt=""></span><span class="tag">中华（硬）</span></button>
<button class="choice jade" data-brand="green" aria-pressed="false"><span class="pack-photo hehua"><img src="assets/hehua.jpg" alt=""></span><span class="tag">钻石（荷花）</span></button></div>
<button class="primary" id="start">抽一支　↗</button><p>靠近手机轻吸，无需对准充电口。</p></section>
<section id="play" hidden><div class="bar"><button id="back">‹ 换一盒</button><b id="brand"></b></div><div class="stage"><div class="stick"><div class="paper"><div class="ember"></div></div><div class="filter"></div></div></div><p id="status" role="status"></p><button class="primary" id="hold" hidden>按住试吸</button><button class="primary" id="again" hidden>再抽一支　↗</button><button class="link" id="manual">改用手动试吸</button></section><button class="link" id="pass">邀请朋友陪一根</button><p id="notice" role="status"></p><input id="copyLink" hidden readonly aria-label="长按复制邀请链接"></main><script src="app.js?v=smoke1"></script></html>
